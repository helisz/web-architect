name: Deploy to GitHub Pages

# 手动触发（用户 2026-11-04 第三批）
#
# 为什么不跟 push 走：站点是**公开**的，而数据权限要等 Supabase 那边跑过
# `supabase/patch-auth-rls.sql`（arch_* 收到 authenticated）才算真正收紧。
# 先跑 SQL、再点这里发布，中间没有"裸奔窗口"。
#
# 发布步骤：
#   1. Supabase SQL Editor 跑 supabase/patch-auth-rls.sql
#   2. Dashboard → Authentication → Providers → Email → 关掉 "Allow new users to sign up"
#   3. Actions → Deploy to GitHub Pages → Run workflow
#
# 站点地址：https://<owner>.github.io/<repo>/

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署；新的取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare env
        # deploy/pages.env 是仓库内的**公开**构建配置（anon key 本来就会打进前端包）。
        # 仓库 Secrets 里如果配了同名项，则以 Secrets 为准（写进 .env.production.local，
        # Vite 的 .local 优先级最高），将来换项目不用改代码。
        run: |
          cp deploy/pages.env .env.production
          if [ -n "${{ secrets.VITE_SUPABASE_URL }}" ]; then
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.production.local
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.production.local
            echo "使用仓库 Secrets 覆盖 Supabase 配置"
          else
            echo "使用 deploy/pages.env 里的公开 Supabase 配置"
          fi

      - name: Build
        # 子路径必须和 Pages 的实际地址一致：/<repo>/
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Check bundle has Supabase config
        # 常见事故：环境变量没进去，线上白屏在 StartupError。这里提前失败。
        run: |
          if ! grep -rq "supabase.co" apps/web/dist/assets/*.js; then
            echo "::error::构建产物里找不到 Supabase URL，检查 deploy/pages.env 或 Secrets"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 首次发布时仓库还没开 Pages：这一项让它用 GITHUB_TOKEN 自动开好（source = Actions）
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
